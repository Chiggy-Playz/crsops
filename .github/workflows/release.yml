name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Parse version from tag
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' must look like vX.Y.Z, e.g. v1.4.2"
            exit 1
          fi
          # 10# forces base 10, so a leading zero (v1.04.2) isn't read as octal.
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor >= 100 || patch >= 100 )); then
            echo "::error::Minor and patch must be below 100 (build number is X*10000 + Y*100 + Z)"
            exit 1
          fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "build_number=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY GOOGLE_SERVER_CLIENT_ID \
                      CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANDROID_KEYSTORE_BASE64 \
                      ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg google "$GOOGLE_SERVER_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, GOOGLE_SERVER_CLIENT_ID: $google}' \
            > env.json
      - name: Build web
        run: |
          flutter build web --release --wasm \
            --dart-define-from-file=env.json \
            --build-name=${{ needs.check.outputs.version }} \
            --build-number=${{ needs.check.outputs.build_number }} \
            --dart-define=APP_VERSION=${{ needs.check.outputs.version }} \
            --dart-define=GIT_SHA=${{ needs.check.outputs.sha }}
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg google "$GOOGLE_SERVER_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, GOOGLE_SERVER_CLIENT_ID: $google}' \
            > env.json
      - name: Set up signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define-from-file=env.json \
            --build-name=${{ needs.check.outputs.version }} \
            --build-number=${{ needs.check.outputs.build_number }} \
            --dart-define=APP_VERSION=${{ needs.check.outputs.version }} \
            --dart-define=GIT_SHA=${{ needs.check.outputs.sha }}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "crs-ops-${{ needs.check.outputs.version }}-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "crs-ops-${{ needs.check.outputs.version }}-armeabi-v7a.apk"
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "crs-ops-${{ needs.check.outputs.version }}-x86_64.apk"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: crs-ops-${{ needs.check.outputs.version }}-*.apk
          generate_release_notes: true
