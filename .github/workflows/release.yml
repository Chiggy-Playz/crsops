name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release

env:
  FLUTTER_VERSION: '3.47.5'

# check, db-test, web-build and android-build run side by side. Only the steps that
# ship something (web-deploy, android-release) wait for check and db-test, so
# a failing analyze or test still blocks the release without delaying the builds.
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Parse version from tag
        id: version
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' must look like vX.Y.Z, e.g. v1.4.2"
            exit 1
          fi
          # 10# forces base 10, so a leading zero (v1.04.2) isn't read as octal.
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( minor >= 100 || patch >= 100 )); then
            echo "::error::Minor and patch must be below 100 (build number is X*10000 + Y*100 + Z)"
            exit 1
          fi
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "build_number=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY GOOGLE_SERVER_CLIENT_ID \
                      CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANDROID_KEYSTORE_BASE64 \
                      ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              missing=1
            fi
          done
          exit $missing

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The SQL tests (supabase/tests) against a throwaway local database built
  # from the migrations, plus a check that supabase/schemas still matches them.
  db-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Same version as locally, so CI builds the database the same way.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      # diff.sh's pg_dump must be at least the database's version
      # (major_version in config.toml); the runner ships an older one.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # Starts only Postgres (no auth or other services, so no secrets) and,
      # on a fresh database, applies the migrations.
      - run: supabase db start
      - run: supabase/tests/run.sh
      - run: supabase/schemas/diff.sh

  web-build:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write env.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg google "$GOOGLE_SERVER_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, GOOGLE_SERVER_CLIENT_ID: $google}' \
            > env.json
      - name: Build web
        run: |
          flutter build web --release --wasm \
            --dart-define-from-file=env.json \
            --build-name=${{ needs.version.outputs.version }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --dart-define=APP_VERSION=${{ needs.version.outputs.version }} \
            --dart-define=GIT_SHA=${{ needs.version.outputs.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web
          retention-days: 1

  web-deploy:
    needs: [check, db-test, web-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7 # for wrangler.jsonc
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: build/web
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  android-build:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-android
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          version: ${{ needs.version.outputs.version }}
          build-number: ${{ needs.version.outputs.build_number }}
          sha: ${{ needs.version.outputs.sha }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          google-server-client-id: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: crs-ops-*.apk
          retention-days: 1

  android-release:
    needs: [version, check, db-test, android-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: crs-ops-${{ needs.version.outputs.version }}-*.apk
          generate_release_notes: true
